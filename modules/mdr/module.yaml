# Vendetta Platform module descriptor. Status: built (service name mdr, host mdr.,
# port 8800). See /docs/ARCHITECTURE.md for the shared contracts.
module:
  name: mdr
  display_name: Managed Detection and Response
  platform: Vendetta Platform
  owner: Vendetta Cloud Team
  service_lines: [managed-security]
  status: in-progress
  enablement: MODULE_ENABLED
  client_portal: per-client

# MDR is a detection and investigation pipeline over the managed-services signals.
# It pulls every managed-services finding, runs it through an ATT&CK-mapped rule set
# with per-client overrides and suppressions, and opens investigations the SOC works
# to a verdict. Clients see published investigations, never raw alerts.
signal_source:
  module: managed-services
  read: GET {MANAGED_SERVICES_URL}/api/findings?status=all   # Bearer MANAGED_SERVICES_TOKEN
  schedule: DETECT_INTERVAL_SECONDS                          # default 120; POST /api/detect/run on demand
  tools: [sentinelone, crowdstrike, huntress, acronis, superops, entra, aws]
  containment_handoff: "{MANAGED_SERVICES_PUBLIC_URL}/alerts/{alert_ref}"   # MDR never acts on a host

detection:
  rules: data                      # admin-editable, every edit versioned and attributed
  rule_fields: [key, name, description, enabled, severity, match, correlation, mitre, response, version]
  match: [tools, types, title_any, min_severity]
  correlation: {group_by: [host, client, title], window_minutes: int, threshold: int}
  response: [none, isolate_host, disable_account, block_indicator]
  per_client_override: [disabled, severity]
  suppressions: {match: [tool, title_contains, host], days: 1..90, expired: monthly_review}
  starter_rules: 15                # mapped to MITRE ATT&CK (T1486, T1003, T1059.001, T1078, T1621, ...)

finding_model:
  type: investigation
  severity: [low, medium, high, critical]
  status: [new, reviewing, confirmed, false_positive, closed]
  native_status: [new, investigating, contained, closed]
  verdict: [pending, true_positive, false_positive, benign]
  numbering: MDR-YYYY-NNNN
  client_owned_status: false
  evidence: true                   # per-investigation signed, hash-chained timeline
  extra_fields: [native_status, verdict, mitre, opened_at, acknowledged_at, contained_at, response, rule, signals]

roles:
  admin: full                      # rule edits and overrides
  analyst: full                    # investigations, suppressions
  viewer: read_only
  client: published_investigations # verdicts, what Vendetta did, own MTTD/MTTA/MTTR
  partner_carrier: scoped_none

api:
  module_manifest: GET /api/module
  findings: GET /api/findings
  escalate: POST /api/findings/{id}/escalate
  suppressions: [GET /api/suppressions, POST /api/suppressions]
  metrics: GET /api/metrics
  coverage: GET /api/coverage
  rules: GET /api/rules
  detect_run: POST /api/detect/run
  provision_sync: POST /api/provision/sync
  evidence_verify: GET /api/investigations/{id}/evidence/verify
  deep_link: GET /clients/platform/{platform_client_id}

deployment:
  service_name: mdr                # on the shared docker network, port 8000 inside
  host_port: 8800
  hostname: mdr
  signs_evidence: true             # EVIDENCE_SIGNING_KEY generated by the deployment
  escalates_to_hub: true           # PLATFORM_HUB_URL and PLATFORM_HUB_TOKEN set by the deployment
  reads_managed_services: true     # MANAGED_SERVICES_URL, MANAGED_SERVICES_TOKEN, MANAGED_SERVICES_PUBLIC_URL

escalation:
  enabled_when: PLATFORM_HUB_URL
  workstream: "Scoping and Containment"
