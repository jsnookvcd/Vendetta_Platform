# Vendetta Platform module catalog. The hub reads this to know which modules exist,
# their status, and the environment flag that turns each on or off. Status is
# production, in-progress, or planned.
platform: Vendetta Platform

modules:
  - name: platform
    display_name: Vendetta Platform
    role: control-plane
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    provisioning: /api/platform/clients
    notes: >-
      The front door and system of record for clients, per-client module
      enablement, per-client tool mapping, service tier and response commitments,
      the Security Journey and client communications. Client 360 across every
      module, and the client portal home that links into every service line. Every client module pulls its roster
      from it (and is pushed a sync when a client changes); the overview and
      readiness screen read their live state back. Deep links into each module's
      view of a client.

  - name: dark-web-monitoring
    display_name: Dark Web Monitoring
    service_lines: [managed-security, incident-response, vciso, litigation-support]
    status: production
    enablement: MODULE_ENABLED
    manifest: /api/module
    findings: /api/findings

  - name: vulnerability-management
    display_name: Vulnerability Management
    service_lines: [managed-security, vciso, pci-asv]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    findings: /api/findings
    escalation: /api/findings/{id}/escalate
    notes: >-
      Scans ingest from the Go scanner service (POST /api/scans), findings dedupe
      across scans, client portal with an exposure trend over time and click-through
      remediation steps. Built, tested, containerized and deployed (port 8400).

  - name: penetration-testing
    display_name: Penetration Testing
    service_lines: [offensive-security]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    findings: /api/findings
    escalation: /api/findings/{id}/escalate
    notes: >-
      Engagements and findings with a retest loop, report rendered from findings,
      client portal with a cross-engagement trend and click-through remediation.
      Built, tested, containerized and deployed (port 8500).

  - name: incident-response
    display_name: Incident Response and Case Management
    service_lines: [incident-response]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    escalation: /api/ir-cases
    role: engagement-hub
    notes: Built and tested; first deploy pending. IR cases, retainers, five-workstream template, incident declaration, client portal.

  - name: sabine
    display_name: SABINE
    role: agent
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    notes: >-
      Security Analysis, Briefing, Investigation, Notification and Escalation: the
      agentic brain. One operator queue across administration, the SOC and
      professional services; proposals with rationale at a per-action autonomy
      level; acts only through module APIs as "api:sabine"; never touches a host;
      signed ledger. Port 8600.
  - name: slack
    display_name: Slack Responder
    role: bridge
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    notes: >-
      Lean, tactical incident response from Slack on top of the IR hub and SABINE.
      Declare (opens the case, pages on-call, spins up a private war room with the
      case card pinned), sitrep, note, status, severity, lead, cards, page, and
      :memo: on any message to log it to the signed case timeline. New cases and
      SABINE proposals post to chosen channels with Approve and Reject. Outside
      tools through their modules: dark web report and PDF, Shodan exposure check,
      EDR host lookup, and containment that a second person approves. Identity is
      the platform staff roster; entries read "<email> via slack". Holds no case
      data. Socket Mode by default, no inbound endpoint. Port 8900.
  - name: professional-services
    display_name: Office of Special Projects
    service_lines: [vciso, advisory, professional-services]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    engagements: /api/engagements
    evidence: /api/clients/{id}/evidence/verify
    escalation: /api/ir-cases
    notes: >-
      vCISO retainers, implementation projects, tabletop exercises, assessments and
      advisory, each run as an engagement with deliverables the client accepts on the
      portal. Every delivery and sign-off is bound into a signed, hash-chained chain
      of custody with a downloadable proof. Escalates live risk to the IR hub. Built,
      tested, containerized and deployed (host osp., port 8700).

  - name: evidence-export
    display_name: Evidence Export
    role: shared-library
    status: in-progress
    notes: >-
      Shared library, not a service. Turns any module's signed chain of custody into a
      court-admissible, self-verifying export package (sealed manifest, embedded
      standalone verifier, optional RFC 3161 trusted timestamp), and provides the
      independent verifier that confirms one offline. Wired into professional-services
      (the reference, per client), incident-response (per case, client copy seals
      internal entries) and managed-services (per client). Built and tested.

  - name: ai-triage
    display_name: AI Triage Copilot
    role: shared-library
    status: in-progress
    notes: >-
      Shared library, not a service. Evidence-grounded triage assistant for the
      finding-bearing modules: proposes a verdict with a calibrated confidence and a
      written rationale, with a deterministic rules fallback that always runs and
      grounds any LLM output. A human accepts or rejects, a second approver is required
      for high-stakes or low-confidence verdicts, and both the proposal and the human
      decision are written to the signed evidence chain. Wired into managed-services
      (the reference: proposal on first sync, accept/override/reject on the alert page,
      copilot sub-object on /api/findings that SABINE reads). Built and tested.

  - name: mdr
    display_name: Managed Detection and Response
    service_lines: [managed-security]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    findings: /api/findings
    escalation: /api/findings/{id}/escalate
    notes: >-
      Detection and investigation over managed-services signals (EDR, identity,
      cloud, backup). Rules are data an admin reads and edits, mapped to MITRE
      ATT&CK, with per-client overrides and expiring suppressions ("this was
      noise"). Investigations carry a verdict, a signed timeline and a containment
      hand-off to managed services; MDR never acts on a host. Publishes MTTD, MTTA
      and MTTR per client. Client portal. Port 8800, host mdr.

  - name: managed-services
    display_name: Managed Services
    service_lines: [managed-security, managed-it]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    findings: /api/findings
    escalation: /api/findings/{id}/escalate
    notes: >-
      Console over every tool a client has deployed (SuperOps, SentinelOne,
      CrowdStrike, Huntress, Acronis), with a client portal for alerts, actions
      taken and messaging the SOC/NOC/helpdesk. Built and tested; live creds pending.

  - name: network-operations
    display_name: Network Operations
    service_lines: [managed-it, managed-security]
    status: planned
    enablement: MODULE_ENABLED
