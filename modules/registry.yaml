# Vendetta Platform module catalog. The hub reads this to know which modules exist,
# their status, and the environment flag that turns each on or off. Status is
# production, in-progress, or planned.
platform: Vendetta Platform

modules:
  - name: platform
    display_name: Vendetta Platform
    role: control-plane
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    provisioning: /api/platform/clients
    notes: >-
      The front door and system of record for clients, per-client module
      enablement, and per-client tool mapping. Modules pull their roster from it;
      the overview reads their live counts back. Built and tested; managed-services
      consumes it today, the other modules adopt the same contract next.

  - name: dark-web-monitoring
    display_name: Dark Web Monitoring
    service_lines: [managed-security, incident-response, vciso, litigation-support]
    status: production
    enablement: MODULE_ENABLED
    manifest: /api/module
    findings: /api/findings

  - name: vulnerability-management
    display_name: Vulnerability Management
    service_lines: [managed-security, vciso, pci-asv]
    status: planned
    enablement: MODULE_ENABLED
    notes: Wraps the existing Go scanner service (Greenbone/Nuclei/Nessus ingest, EPSS/KEV enrichment).

  - name: penetration-testing
    display_name: Penetration Testing
    service_lines: [offensive-security]
    status: planned
    enablement: MODULE_ENABLED

  - name: incident-response
    display_name: Incident Response and Case Management
    service_lines: [incident-response]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    escalation: /api/ir-cases
    role: engagement-hub
    notes: Built and tested; first deploy pending. IR cases, retainers, five-workstream template, incident declaration, client portal.

  - name: mdr
    display_name: Managed Detection and Response
    service_lines: [managed-security]
    status: planned
    enablement: MODULE_ENABLED

  - name: managed-services
    display_name: Managed Services
    service_lines: [managed-security, managed-it]
    status: in-progress
    enablement: MODULE_ENABLED
    manifest: /api/module
    findings: /api/findings
    notes: >-
      Console over every tool a client has deployed (SuperOps, SentinelOne,
      CrowdStrike, Huntress, Acronis), with a client portal for alerts, actions
      taken and messaging the SOC/NOC/helpdesk. Built and tested; live creds pending.

  - name: network-operations
    display_name: Network Operations
    service_lines: [managed-it, managed-security]
    status: planned
    enablement: MODULE_ENABLED
