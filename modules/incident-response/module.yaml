# Vendetta Platform module descriptor.
# This module is the engagement hub spine: it RECEIVES escalations from the other
# modules and is the system of record for clients, retainers and IR cases.
# See /docs/ARCHITECTURE.md and README.md in this directory.
module:
  name: incident-response
  display_name: Incident Response and Case Management
  platform: Vendetta Platform
  owner: Vendetta Cloud Team
  service_lines: [incident-response]
  status: in-progress          # built and tested; first deploy pending
  enablement: MODULE_ENABLED
  role: engagement-hub         # the spine other modules escalate into
  client_portal: per-client    # portal_enabled + portal_domains on the client

case_model:
  id: number                   # firm-wide running sequence, CASE_PREFIX-CASE_YEAR-seq; client and incident type never in the ID
  statuses: [open, contained, eradicated, recovered, closed]
  workstreams:                 # fixed five-workstream template, created on every case
    - Scoping and Containment
    - Forensics and Analysis
    - Recovery and Restoration
    - Notification and Legal
    - Resilience and Hardening
  workstream_statuses: [not_started, in_progress, blocked, done]
  origins: [manual, declared, escalated]
  privileged: true             # counsel-directed cases show the client milestones only
  retainers: true              # GetZero retainers; one-button incident declaration
  deliverable_issuing_line: "Incident Response"

board:                         # Kanban per case; rules in app/board.py
  columns: [todo, in_progress, blocked, done]
  lanes: workstreams
  playbook: app/playbook.py    # cards every case opens with
  syncs:
    - card move writes a timeline entry
    - timeline entry on a card starts it, or moves it as chosen
    - escalated finding adds a review card
    - workstream status derived from its cards, shared on the client timeline

api:
  module_manifest: GET /api/module
  cases: GET /api/ir-cases
  open_case: POST /api/ir-cases          # modules escalate findings here (link-or-open)
  declare_incident: POST /api/ir-cases/declare
  docs: /api/docs
  auth: Bearer token from the settings page

paging:
  sns: SNS_TOPIC_ARN
  teams: TEAMS_WEBHOOK_URL
  case_links: PUBLIC_URL

roles:
  admin: full                  # built
  analyst: full                # built
  client: case_milestones      # built: portal, scoped to own client, internal-only and privileged detail hidden
  client_executive: case_milestones   # planned split of the client role
  client_technical: case_detail       # planned
  breach_counsel: privileged_full     # planned
  partner_carrier: scoped_panel       # planned
