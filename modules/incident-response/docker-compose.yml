services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: irhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-irhub}
      POSTGRES_DB: irhub
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irhub"]
      interval: 15s
      retries: 10
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://irhub:${POSTGRES_PASSWORD:-irhub}@db:5432/irhub
    depends_on:
      db: {condition: service_healthy}
    # Loopback by default (SSM port-forward). Set WEB_BIND=0.0.0.0 behind an ALB.
    ports:
      - "${WEB_BIND:-127.0.0.1}:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
