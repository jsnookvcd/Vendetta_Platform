[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fw-forensics"
version = "1.0.0"
description = "Vendetta forensic workstation: custody logging and Claude MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "boto3>=1.34"]

[project.scripts]
fw-forensics-mcp = "fw_forensics.server:main"

[tool.setuptools]
packages = ["fw_forensics"]
