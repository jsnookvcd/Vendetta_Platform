title: Password spray from one source IP
id: 4ef632f5-62f6-4e01-afa2-4d0d251ab8ee
status: stable
description: Authentication failures for 10 or more distinct users from a single source IP within 10 minutes. One address trying a few passwords across many accounts is the signature of a password spray.
author: Vendetta Cyber
date: 2026-10-19
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  category: authentication
detection:
  failure:
    status_id: 2
  condition: failure
timeframe: 10m
vendetta:
  threshold:
    count: 10
    group_by:
      - src_endpoint.ip
    distinct: user.name
fields:
  - src_endpoint.ip
  - user.name
falsepositives:
  - Shared egress IPs (corporate NAT, VDI) where a misconfigured service account or expired password loop hits many users.
level: high
