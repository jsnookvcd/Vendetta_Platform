title: Encoded PowerShell command line
id: 0c1841fe-c3a5-44bc-8df1-ad6f16f42e0e
status: stable
description: PowerShell launched with an encoded command (-EncodedCommand or any of its short forms such as -enc, -ec or -e followed by a long base64 string). Malware and hands on keyboard operators encode commands to evade command line inspection.
author: Vendetta Cyber
date: 2026-10-19
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  powershell:
    - process.file.name:
        - powershell.exe
        - pwsh.exe
    - process.file.path|endswith:
        - \powershell.exe
        - \pwsh.exe
  encoded:
    process.cmd_line|re: '(?i)\s[-/](e|ec|en|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand)\s+["'']?[A-Za-z0-9+/=]{20,}'
  condition: powershell and encoded
fields:
  - device.hostname
  - actor.user.name
  - process.cmd_line
  - process.parent_process.file.path
falsepositives:
  - Management agents (SCCM, some RMM tools) that run encoded maintenance scripts; baseline them by parent process.
level: high
