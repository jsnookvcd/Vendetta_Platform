title: Ransomware recovery inhibition by shadow copy deletion or boot recovery disabled
id: 6f02d275-9880-4f0f-ad4e-1cbe175ce62e
status: stable
description: A process deleted volume shadow copies or the backup catalog (vssadmin delete shadows, wmic shadowcopy delete, Win32_ShadowCopy Delete, wbadmin delete catalog) or disabled Windows boot recovery with bcdedit. Ransomware does this immediately before encryption so the victim cannot roll back.
author: Vendetta Cyber
date: 2026-10-19
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
detection:
  vssadmin:
    process.cmd_line|contains|all:
      - vssadmin
      - delete
      - shadows
  wmic:
    process.cmd_line|contains|all:
      - wmic
      - shadowcopy
      - delete
  wmi_object:
    process.cmd_line|contains|all:
      - win32_shadowcopy
      - .delete(
  wbadmin:
    process.cmd_line|contains|all:
      - wbadmin
      - delete
      - catalog
  # Literal matching only: a regular expression over an attacker-controlled command
  # line is a denial-of-service risk for the whole detection pass.
  bcdedit_recovery:
    process.cmd_line|contains|all:
      - bcdedit
      - recoveryenabled
  recovery_off:
    process.cmd_line|contains:
      - 'recoveryenabled no'
      - 'recoveryenabled off'
      - 'recoveryenabled false'
      - 'recoveryenabled 0'
      - 'recoveryenabled "no"'
  bcdedit_status:
    process.cmd_line|contains|all:
      - bcdedit
      - bootstatuspolicy
      - ignoreallfailures
  condition: vssadmin or wmic or wmi_object or wbadmin or (bcdedit_recovery and recovery_off) or bcdedit_status
fields:
  - device.hostname
  - actor.user.name
  - process.cmd_line
falsepositives:
  - Backup software pruning old shadow copies; baseline by parent process and schedule.
level: critical
