{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block anon %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand" style="justify-content:center; flex-direction:column; text-align:center; gap:12px"><img class="logo" src="/static/logo.png" alt="Vendetta" style="width:60px;height:60px"><div class="name" style="font-size:14px">Dark Web<span>Monitoring</span></div></div>
    {% if error %}<p class="login-err">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">Username<input name="username" autofocus autocomplete="username"></label>
      <label class="field">Password<input name="password" type="password" autocomplete="current-password"></label>
      <div style="margin-top:16px"><button class="btn btn-primary" type="submit" style="width:100%; justify-content:center">Sign in</button></div>
    </form>
  </div>
</div>
{% endblock %}
