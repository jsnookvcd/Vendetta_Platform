{% extends "base.html" %}{% block body %}
<div class="panel" style="max-width:380px;margin:60px auto">
  <h1>Sign in</h1>
  {% if error %}<p class="bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <p><input name="username" placeholder="username" style="width:100%" autofocus></p>
    <p><input name="password" type="password" placeholder="password" style="width:100%"></p>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
