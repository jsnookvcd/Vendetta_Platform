services:
  tor:
    build: ./infra/tor
    restart: unless-stopped
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: darkweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darkweb}
      POSTGRES_DB: darkweb
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkweb"]
      interval: 15s
      retries: 10
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://darkweb:${POSTGRES_PASSWORD:-darkweb}@db:5432/darkweb
      TOR_PROXY: socks5://tor:9050
    depends_on:
      db: {condition: service_healthy}
    # Bind to loopback by default (SSM port-forward only). Set WEB_BIND=0.0.0.0
    # when fronting with the ALB; the instance security group is the gate either way.
    ports:
      - "${WEB_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - evidence:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Shared cross-module network: other modules reach this one as http://dark-web-monitoring:8000
    networks:
      internal:
      vendetta:
        aliases: [dark-web-monitoring]

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://darkweb:${POSTGRES_PASSWORD:-darkweb}@db:5432/darkweb
      TOR_PROXY: socks5://tor:9050
    depends_on:
      db: {condition: service_healthy}
      tor: {condition: service_healthy}
    volumes:
      - evidence:/data
    networks: [internal]

  # Vendetta's own RansomLook instance (infra/ransomlook). Off unless the .env
  # carries COMPOSE_PROFILES=ransomlook; then set RANSOMLOOK_URL=http://ransomlook:8000
  # so the worker reads it instead of the public instance. Internal network only:
  # no host port, no ALB route.
  ransomlook:
    profiles: ["ransomlook"]
    build: ./infra/ransomlook
    restart: unless-stopped
    environment:
      SCRAPE_INTERVAL_MINUTES: ${RANSOMLOOK_SCRAPE_INTERVAL_MINUTES:-60}
      BOOTSTRAP_FROM: ${RANSOMLOOK_BOOTSTRAP_FROM:-https://www.ransomlook.io}
      WEB_WORKERS: "2"
    mem_limit: ${RANSOMLOOK_MEM_LIMIT:-3g}
    shm_size: 512m
    volumes:
      - ransomlook-cache:/opt/RansomLook/cache
      - ransomlook-source:/opt/RansomLook/source
    networks: [internal]

volumes:
  pgdata:
  evidence:
  ransomlook-cache:
  ransomlook-source:

networks:
  internal:
  # Created once on the host (docker network create vendetta); shared by every module stack.
  vendetta:
    external: true
