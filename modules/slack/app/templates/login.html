{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block anon %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand" style="justify-content:center; flex-direction:column; text-align:center; gap:12px"><img class="logo" src="/static/logo.png" alt="Vendetta" style="width:60px;height:60px"><div class="name" style="font-size:14px">Slack Responder<span>Vendetta</span></div></div>
    {% if error %}<p class="login-err">{{ error }}</p>{% endif %}
    <p class="faint" style="font-size:12px; text-align:center">Responders work in Slack. This console is the operator status page.</p>
    <form method="post" action="/login">
      <label class="field">Username<input name="username" autofocus autocomplete="username"></label>
      <label class="field" style="margin-top:12px">Password<input name="password" type="password" autocomplete="current-password"></label>
      <div style="margin-top:16px"><button class="btn btn-primary" type="submit" style="width:100%; justify-content:center">Sign in</button></div>
    </form>
  </div>
</div>
{% endblock %}
