{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block anon %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand" style="justify-content:center; flex-direction:column; text-align:center; gap:12px"><img class="logo" src="/static/logo.png" alt="Vendetta" style="width:60px;height:60px"><div class="name" style="font-size:14px">Vendetta<span>Platform</span></div></div>
    {% if error %}<p class="login-err">{{ error }}</p>{% endif %}
    {% if oidc_enabled %}
    <a class="btn btn-primary" href="/auth/login" style="width:100%; justify-content:center; gap:9px">
      <svg width="16" height="16" viewBox="0 0 23 23" aria-hidden="true"><rect x="1" y="1" width="10" height="10" fill="#f25022"/><rect x="12" y="1" width="10" height="10" fill="#7fba00"/><rect x="1" y="12" width="10" height="10" fill="#00a4ef"/><rect x="12" y="12" width="10" height="10" fill="#ffb900"/></svg>
      Sign in with Microsoft 365
    </a>
    <details style="margin-top:10px">
      <summary class="faint" style="cursor:pointer; font-size:12px; text-align:center; list-style:none">Admin sign in</summary>
      <form method="post" action="/login" style="margin-top:10px">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="field">Username<input name="username" autocomplete="username"></label>
        <label class="field" style="margin-top:10px">Password<input name="password" type="password" autocomplete="current-password"></label>
        <div style="margin-top:14px"><button class="btn" type="submit" style="width:100%; justify-content:center">Sign in</button></div>
      </form>
    </details>
    {% else %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">Username<input name="username" autofocus autocomplete="username"></label>
      <label class="field" style="margin-top:12px">Password<input name="password" type="password" autocomplete="current-password"></label>
      <div style="margin-top:16px"><button class="btn btn-primary" type="submit" style="width:100%; justify-content:center">Sign in</button></div>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
