<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ client.name }}{% endblock %} · Vendetta</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/png" href="/static/logo.png">
</head>
<body>
<header class="portaltop">
  <a href="/portal"><img class="logo" src="/static/logo.png" alt="Vendetta" style="width:30px;height:30px"></a>
  <div class="pt-title">{{ client.name }}<span>Vendetta Cyber client portal</span></div>
  <span class="spacer"></span>
  <span class="faint" style="font-size:12px">{{ portal_user }}{% if exec_view %} · executive view{% endif %}</span>
  <a href="/logout" class="faint" style="font-size:12px">Sign out</a>
</header>
<main class="portal-wrap">{% block body %}{% endblock %}</main>
</body>
</html>
