services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: platform
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 15s
      retries: 10
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD:-platform}@db:5432/platform
    depends_on:
      db: {condition: service_healthy}
    # Loopback by default (SSM port-forward). Set WEB_BIND=0.0.0.0 behind an ALB.
    ports:
      - "${WEB_BIND:-127.0.0.1}:8300:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Shared cross-module network: other modules reach this one as http://platform:8000
    networks:
      internal:
      vendetta:
        aliases: [platform]

volumes:
  pgdata:

networks:
  internal:
  # Created once on the host (docker network create vendetta); shared by every module stack.
  vendetta:
    external: true
