# Vendetta Platform module descriptor. Status: in-progress (built and tested).
# See /docs/ARCHITECTURE.md for the shared contracts and
# /modules/dark-web-monitoring for the reference implementation.
module:
  name: penetration-testing
  display_name: Penetration Testing
  platform: Vendetta Platform
  owner: Vendetta Cloud Team
  service_lines: [offensive-security]
  status: in-progress
  enablement: MODULE_ENABLED
  client_portal: per-client

finding_model:
  type: pentest-finding
  parent: engagement                  # findings belong to an engagement
  severity: [info, low, medium, high, critical]
  status: [open, remediating, retest_pending, retest_passed, accepted, false_positive]
  client_owned_status: true           # clients mark remediation steps done
  retest: true                        # the retest loop closes a finding
  evidence: true
  report: rendered from the engagement findings at close
  fields: [asset, cve, cvss, impact, remediation]

roles:
  admin: full
  analyst: full
  client: shared_engagements_detail   # own shared engagements, findings and reports
  partner_carrier: scoped_none

api:
  module_manifest: GET /api/module
  findings: GET /api/findings         # shared finding model, carries subject.platform_client_id
  escalate: POST /api/findings/{id}/escalate

escalation:
  enabled_when: PLATFORM_HUB_URL
  workstream: "Resilience and Hardening"
