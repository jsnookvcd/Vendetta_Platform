name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: platform
            role: platform
            db: platform_test
          - module: incident-response
            role: irhub
            db: irhub_test
          - module: managed-services
            role: msp
            db: msp_test
          - module: dark-web-monitoring
            role: darkweb
            db: darkweb_test
          - module: vulnerability-management
            role: vulnmgmt
            db: vulnmgmt_test
          - module: penetration-testing
            role: pentest
            db: pentest_test
          - module: sabine
            role: sabine
            db: sabine_test
          - module: professional-services
            role: psvc
            db: psvc_test
          - module: evidence-export
            role: evexport
            db: evexport_test
          - module: ai-triage
            role: aitriage
            db: aitriage_test
          - module: mdr
            role: mdr
            db: mdr_test
          - module: project-management
            role: pmtool
            db: pmtool_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for PDF rendering (dark web only)
        if: matrix.module == 'dark-web-monitoring'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev libcairo2

      - name: Create test role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE ${{ matrix.role }} LOGIN PASSWORD '${{ matrix.role }}';
          CREATE DATABASE ${{ matrix.db }} OWNER ${{ matrix.role }};
          SQL

      - name: Install dependencies
        working-directory: modules/${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: modules/${{ matrix.module }}
        run: pytest -q

  images:
    name: docker build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [platform, incident-response, managed-services, dark-web-monitoring,
                 vulnerability-management, penetration-testing, sabine, professional-services, mdr,
                 project-management]
    steps:
      - uses: actions/checkout@v4
      - name: Build the module image the host builds
        run: docker build -t vcd-${{ matrix.module }}:ci modules/${{ matrix.module }}
      - name: Image refuses to boot on a placeholder secret
        run: |
          set +e
          docker run --rm -e SECRET_KEY=change-me -e DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1/x \
            vcd-${{ matrix.module }}:ci python -c "from app import boot; boot.check()"
          rc=$?
          set -e
          test "$rc" -ne 0 && echo "fail-closed boot confirmed"

  infra:
    name: terraform and host scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -diff
      - name: terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: shellcheck host scripts
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck -S warning infra/redeploy.sh infra/verify.sh infra/host/vendetta-env infra/host/vendetta-backup \
            modules/dark-web-monitoring/infra/ransomlook/entrypoint.sh
      - name: compose files parse
        run: |
          docker network create vendetta
          for m in modules/*/; do
            [ -f "$m/docker-compose.yml" ] || continue
            printf 'SECRET_KEY=ci\n' > "$m/.env"
            docker compose -f "$m/docker-compose.yml" --project-name "ci-$(basename "$m")" config -q
          done
